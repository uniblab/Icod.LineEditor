name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  RELEASE_DIRECTORY: artifacts/release
  SELECTED_PACKAGE_DIRECTORY: artifacts/release-packages
  PACKAGE_ARTIFACT: nuget-packages

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      solution_path: ${{ steps.repository.outputs.solution_path }}
      has_executables: ${{ steps.repository.outputs.has_executables }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - id: repository
        shell: pwsh
        run: ./packaging/Get-RepositoryMetadata.ps1 -Configuration '${{ env.CONFIGURATION }}' -GitHubOutputPath $env:GITHUB_OUTPUT
      - name: Require tagged commit on default branch
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin $env:DEFAULT_BRANCH --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA "origin/$env:DEFAULT_BRANCH"
          if (0 -ne $LASTEXITCODE) { throw "Release tag is not contained in '$env:DEFAULT_BRANCH'." }
      - id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw "Unsupported release tag '$env:GITHUB_REF_NAME'."
          }
          $version = $Matches.version
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  package:
    needs: metadata
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.select.outputs.has_packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore '${{ needs.metadata.outputs.solution_path }}'
      - run: dotnet build '${{ needs.metadata.outputs.solution_path }}' -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet pack '${{ needs.metadata.outputs.solution_path }}' -c ${{ env.CONFIGURATION }} --no-build --no-restore -o ${{ env.RELEASE_DIRECTORY }} -p:ContinuousIntegrationBuild=true
      - id: select
        shell: pwsh
        run: ./packaging/SelectReleasePackages.ps1 -SourceDirectory '${{ env.RELEASE_DIRECTORY }}' -DestinationDirectory '${{ env.SELECTED_PACKAGE_DIRECTORY }}' -ExpectedVersion '${{ needs.metadata.outputs.version }}' -GitHubOutputPath $env:GITHUB_OUTPUT
      - name: Verify release packages
        if: steps.select.outputs.has_packages == 'true'
        shell: pwsh
        run: ./packaging/VerifyPackageArtifact.ps1 -ArtifactDirectory '${{ env.SELECTED_PACKAGE_DIRECTORY }}' -Configuration '${{ env.CONFIGURATION }}' -ExpectedVersion '${{ needs.metadata.outputs.version }}'
      - name: Upload release packages
        if: steps.select.outputs.has_packages == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: ${{ env.SELECTED_PACKAGE_DIRECTORY }}/*.nupkg
          if-no-files-found: error

  archives:
    needs: metadata
    if: needs.metadata.outputs.has_executables == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - shell: pwsh
        run: ./packaging/BuildReleaseArchive.ps1 -Configuration '${{ env.CONFIGURATION }}' -RuntimeIdentifier '${{ matrix.rid }}' -Version '${{ needs.metadata.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ matrix.rid }}
          path: ${{ env.RELEASE_DIRECTORY }}/Icod.LineEditor-${{ needs.metadata.outputs.version }}-${{ matrix.rid }}.zip
          if-no-files-found: error

  publish-nuget:
    needs: [metadata, package]
    if: needs.package.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/package
      - id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          foreach ($package in Get-ChildItem artifacts/package -Filter '*.nupkg' -File) {
              dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
              if (0 -ne $LASTEXITCODE) { throw "NuGet publication failed." }
          }

  publish-github-packages:
    needs: [metadata, package]
    if: needs.package.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/package
      - shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          $source = "https://nuget.pkg.github.com/$env:GITHUB_OWNER/index.json"
          foreach ($package in Get-ChildItem artifacts/package -Filter '*.nupkg' -File) {
              dotnet nuget push $package.FullName --source $source --api-key $env:GITHUB_TOKEN --skip-duplicate
              if (0 -ne $LASTEXITCODE) { throw "GitHub Packages publication failed." }
          }

  github-release:
    needs: [metadata, package, archives, publish-nuget, publish-github-packages]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.archives.result == 'success' || needs.archives.result == 'skipped') &&
      (needs.publish-nuget.result == 'success' || needs.publish-nuget.result == 'skipped') &&
      (needs.publish-github-packages.result == 'success' || needs.publish-github-packages.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        if: needs.package.outputs.has_packages == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/release-assets
      - name: Download archives
        if: needs.metadata.outputs.has_executables == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-archive-*
          path: artifacts/release-assets
          merge-multiple: true
      - name: Create checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/release-assets -Force | Out-Null
          $files = @(Get-ChildItem artifacts/release-assets -File | Where-Object { $_.Extension -in @('.zip','.nupkg') } | Sort-Object Name)
          if (0 -eq $files.Count) { throw 'No release assets were produced.' }
          $lines = foreach ($file in $files) { "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($file.Name)" }
          [System.IO.File]::WriteAllLines('artifacts/release-assets/SHA256SUMS.txt',$lines,[System.Text.UTF8Encoding]::new($false))
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $args = @('release','create',$env:GITHUB_REF_NAME,'--verify-tag','--title',"Icod.LineEditor ${{ needs.metadata.outputs.version }}",'--generate-notes')
          if ('true' -eq '${{ needs.metadata.outputs.prerelease }}') { $args += @('--prerelease','--latest=false') }
          $args += @(Get-ChildItem artifacts/release-assets -File | Sort-Object Name | ForEach-Object { $_.FullName })
          & gh @args
          if (0 -ne $LASTEXITCODE) { throw 'GitHub Release creation failed.' }
